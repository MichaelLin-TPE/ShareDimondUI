<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Q版騎士在釣魚池夜釣">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a26"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb35a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e8842a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e8842a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc270" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#e8842a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e8842a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2b0"/>
      <stop offset="1" stop-color="#f0a65a"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="1" stop-color="#3e2a19"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#c9d2e0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d7ba8"/>
      <stop offset="1" stop-color="#2f4470"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb35a"/>
      <stop offset="1" stop-color="#e8842a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="waterClip"><rect x="0" y="560" width="1600" height="340"/></clipPath>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="90" r="1.6"/><circle cx="260" cy="150" r="1.2"/><circle cx="410" cy="60" r="1.4"/><circle cx="560" cy="130" r="1"/>
    <circle cx="700" cy="40" r="1.5"/><circle cx="1320" cy="70" r="1.3"/><circle cx="1460" cy="140" r="1.6"/><circle cx="1540" cy="60" r="1"/>
    <circle cx="880" cy="110" r="1.2"/><circle cx="1180" cy="40" r="1.1"/><circle cx="200" cy="260" r="1"/><circle cx="1500" cy="260" r="1.2"/>
  </g>

  <!-- 月亮 -->
  <circle cx="1150" cy="230" r="230" fill="url(#moonGlow)"/>
  <circle cx="1150" cy="230" r="96" fill="url(#moon)"/>
  <g fill="#e2934b" opacity="0.35">
    <circle cx="1118" cy="205" r="14"/><circle cx="1170" cy="262" r="20"/><circle cx="1188" cy="200" r="8"/><circle cx="1130" cy="270" r="7"/>
  </g>

  <!-- 遠山 -->
  <path d="M0 470 L120 400 L230 440 L330 370 L450 430 L560 380 L680 440 L800 400 L920 450 L1040 410 L1160 460 L1290 400 L1400 450 L1500 410 L1600 460 L1600 600 L0 600 Z" fill="#0a0f18"/>
  <path d="M0 520 L140 470 L260 500 L400 450 L520 500 L640 470 L760 510 L900 480 L1020 520 L1150 490 L1280 530 L1420 500 L1600 540 L1600 620 L0 620 Z" fill="#070b12"/>

  <!-- 水面 -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#water)"/>
  <g clip-path="url(#waterClip)">
    <!-- 月亮倒影 -->
    <g fill="#f0a65a" opacity="0.28">
      <ellipse cx="1150" cy="600" rx="70" ry="6"/><ellipse cx="1165" cy="622" rx="90" ry="6"/><ellipse cx="1140" cy="646" rx="60" ry="5"/>
      <ellipse cx="1170" cy="672" rx="110" ry="6"/><ellipse cx="1150" cy="700" rx="75" ry="5"/><ellipse cx="1180" cy="730" rx="120" ry="6"/>
      <ellipse cx="1145" cy="765" rx="80" ry="5"/><ellipse cx="1175" cy="805" rx="130" ry="6"/><ellipse cx="1150" cy="850" rx="90" ry="5"/>
    </g>
    <!-- 水紋 -->
    <g stroke="#2a4a66" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M60 640 q40 -8 80 0 t80 0"/><path d="M260 700 q50 -8 100 0 t100 0"/><path d="M1380 660 q40 -8 80 0 t80 0"/>
      <path d="M1300 760 q50 -8 100 0 t100 0"/><path d="M120 800 q40 -8 80 0 t80 0"/><path d="M700 840 q40 -8 80 0 t80 0"/>
    </g>
  </g>

  <!-- 蘆葦 -->
  <g stroke="#1f2a1b" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M1470 620 q10 -80 -6 -160"/><path d="M1500 630 q14 -90 30 -170"/><path d="M1530 640 q-4 -70 12 -140"/>
  </g>
  <g fill="#3a2b1c"><ellipse cx="1462" cy="470" rx="7" ry="22"/><ellipse cx="1531" cy="462" rx="7" ry="22"/><ellipse cx="1541" cy="502" rx="6" ry="18"/></g>

  <!-- 木棧道 -->
  <g>
    <rect x="0" y="600" width="760" height="46" fill="url(#plank)"/>
    <g stroke="#2b1c10" stroke-width="3"><line x1="0" y1="612" x2="760" y2="612"/><line x1="0" y1="632" x2="760" y2="632"/></g>
    <g stroke="#24170d" stroke-width="3">
      <line x1="90" y1="600" x2="90" y2="646"/><line x1="200" y1="600" x2="200" y2="646"/><line x1="310" y1="600" x2="310" y2="646"/>
      <line x1="420" y1="600" x2="420" y2="646"/><line x1="530" y1="600" x2="530" y2="646"/><line x1="640" y1="600" x2="640" y2="646"/>
    </g>
    <rect x="0" y="646" width="760" height="10" fill="#22150c"/>
    <!-- 樁 -->
    <rect x="140" y="640" width="26" height="150" fill="#3a2716"/><rect x="420" y="640" width="26" height="130" fill="#3a2716"/><rect x="722" y="640" width="26" height="170" fill="#3a2716"/>
    <rect x="140" y="640" width="8" height="150" fill="#553a22"/><rect x="420" y="640" width="8" height="130" fill="#553a22"/><rect x="722" y="640" width="8" height="170" fill="#553a22"/>
  </g>

  <!-- 燈籠柱 -->
  <g>
    <circle cx="230" cy="470" r="170" fill="url(#lampGlow)"/>
    <rect x="222" y="470" width="16" height="130" fill="#2c1d10"/>
    <rect x="200" y="452" width="60" height="10" rx="3" fill="#2c1d10"/>
    <line x1="230" y1="462" x2="230" y2="478" stroke="#2c1d10" stroke-width="4"/>
    <path d="M196 478 h68 l-8 70 h-52 z" fill="#e8842a" stroke="#2c1d10" stroke-width="5" stroke-linejoin="round"/>
    <rect x="212" y="492" width="36" height="42" rx="4" fill="#ffd28a"/>
    <rect x="222" y="500" width="16" height="24" rx="3" fill="#fff2cf"/>
    <rect x="204" y="546" width="52" height="8" rx="2" fill="#2c1d10"/>
  </g>

  <!-- 漁獲桶 -->
  <g transform="translate(470 545)">
    <path d="M0 10 h70 l-8 60 h-54 z" fill="#3b4a5c" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-4" y="4" width="78" height="12" rx="4" fill="#546a86" stroke="#111823" stroke-width="5"/>
    <path d="M16 2 q19 -32 38 0" fill="none" stroke="#111823" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 -6 q-14 -26 -26 -16 q4 12 12 20 z" fill="url(#fish)" stroke="#111823" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 -4 q14 -28 28 -14 q-4 12 -14 20 z" fill="url(#fish)" stroke="#111823" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Q 版騎士:坐在棧道末端,面向右 -->
  <g transform="translate(640 380)">
    <!-- 影子 -->
    <ellipse cx="60" cy="222" rx="70" ry="10" fill="#000" opacity="0.5"/>
    <!-- 腿 -->
    <g stroke="#111823" stroke-width="5" stroke-linejoin="round">
      <path d="M52 176 q-4 40 6 74 h30 q-4 -36 0 -74 z" fill="#2b3a55"/>
      <path d="M92 176 q-2 40 8 76 h32 q-6 -38 -2 -76 z" fill="#2b3a55"/>
      <path d="M50 246 h42 v22 q-8 10 -30 10 q-14 0 -14 -10 z" fill="url(#steel)"/>
      <path d="M92 248 h44 v22 q-8 10 -30 10 q-14 0 -14 -10 z" fill="url(#steel)"/>
    </g>
    <!-- 身體/盔甲 -->
    <path d="M28 96 q20 -22 60 -22 q46 0 66 22 l8 86 q-40 18 -74 18 q-42 0 -70 -18 z" fill="url(#armor)" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <path d="M56 96 q28 10 62 0 l6 30 q-38 12 -74 0 z" fill="#6e86ad" opacity="0.6"/>
    <!-- 腰帶 -->
    <path d="M34 150 q56 22 122 0 l2 16 q-64 22 -126 0 z" fill="#5a3b1f" stroke="#111823" stroke-width="4" stroke-linejoin="round"/>
    <rect x="86" y="150" width="20" height="18" rx="3" fill="#e8b25a" stroke="#111823" stroke-width="3"/>
    <!-- 肩甲 -->
    <ellipse cx="34" cy="100" rx="30" ry="22" fill="url(#steel)" stroke="#111823" stroke-width="5"/>
    <ellipse cx="148" cy="100" rx="30" ry="22" fill="url(#steel)" stroke="#111823" stroke-width="5"/>
    <!-- 左手臂(靠身體) -->
    <path d="M40 118 q-24 34 -4 62 q12 8 26 -6 q-8 -30 2 -52 z" fill="url(#armor)" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <!-- 右手臂(拿竿) -->
    <path d="M150 120 q48 6 78 -22 q10 -6 16 4 q-22 44 -74 50 q-24 2 -20 -32 z" fill="url(#armor)" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="236" cy="96" r="16" fill="#f1c9a2" stroke="#111823" stroke-width="5"/>
    <!-- 頭 -->
    <circle cx="92" cy="20" r="76" fill="#f3d1b0" stroke="#111823" stroke-width="5"/>
    <!-- 頭髮(棕) -->
    <path d="M18 8 q6 -70 74 -70 q70 0 78 62 q-16 -30 -40 -30 q-14 8 -34 -4 q-22 20 -50 6 q-16 6 -28 36 z" fill="#5a3a22" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <path d="M40 -46 q30 -30 78 -6" fill="none" stroke="#7a5236" stroke-width="6" stroke-linecap="round"/>
    <!-- 耳朵 -->
    <circle cx="20" cy="30" r="10" fill="#f3d1b0" stroke="#111823" stroke-width="4"/>
    <!-- 眼睛(放鬆瞇眼) -->
    <path d="M70 34 q12 -12 24 0" fill="none" stroke="#111823" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 34 q12 -12 24 0" fill="none" stroke="#111823" stroke-width="6" stroke-linecap="round"/>
    <!-- 腮紅 -->
    <ellipse cx="66" cy="52" rx="12" ry="6" fill="#f08a7a" opacity="0.6"/>
    <ellipse cx="146" cy="52" rx="12" ry="6" fill="#f08a7a" opacity="0.6"/>
    <!-- 嘴 -->
    <path d="M100 62 q10 10 22 0" fill="none" stroke="#111823" stroke-width="5" stroke-linecap="round"/>
    <!-- 釣竿 -->
    <path d="M236 96 L520 -120" stroke="#3b2a18" stroke-width="9" stroke-linecap="round"/>
    <path d="M236 96 L520 -120" stroke="#7a5236" stroke-width="4" stroke-linecap="round"/>
    <circle cx="250" cy="86" r="9" fill="#3b2a18" stroke="#111823" stroke-width="3"/>
  </g>

  <!-- 釣線 + 浮標 -->
  <path d="M1160 260 q-10 200 -30 380" stroke="#d9e2ee" stroke-width="2.5" fill="none" opacity="0.85"/>
  <g transform="translate(1130 640)">
    <ellipse cx="0" cy="8" rx="26" ry="5" fill="#ffffff" opacity="0.18"/>
    <path d="M-10 -20 h20 l-4 30 h-12 z" fill="#e8842a" stroke="#111823" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-6" y="-30" width="12" height="12" rx="2" fill="#f4f6fa" stroke="#111823" stroke-width="3"/>
  </g>

  <!-- 跳出水面的魚 + 水花 -->
  <g transform="translate(1330 560) rotate(-30)">
    <path d="M0 0 q60 -46 130 0 q-70 46 -130 0 z" fill="url(#fish)" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <path d="M124 0 l34 -30 v60 z" fill="#e8842a" stroke="#111823" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 -20 l14 -22 l16 22 z" fill="#f4a24f" stroke="#111823" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="28" cy="-6" r="7" fill="#111823"/><circle cx="30" cy="-8" r="2.5" fill="#fff"/>
    <path d="M40 10 q14 4 26 0" stroke="#111823" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#9fc3dc" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M1300 640 q-12 -34 -30 -50"/><path d="M1350 646 q6 -36 28 -58"/><path d="M1400 656 q22 -20 44 -26"/>
  </g>
  <g fill="#c7e0f2" opacity="0.9"><circle cx="1262" cy="580" r="6"/><circle cx="1392" cy="574" r="5"/><circle cx="1448" cy="612" r="7"/><circle cx="1320" cy="560" r="4"/></g>

  <!-- 螢火 / 餘燼 -->
  <g fill="#ffb35a">
    <circle cx="380" cy="360" r="4" opacity="0.9"/><circle cx="320" cy="300" r="3" opacity="0.7"/><circle cx="560" cy="330" r="3.5" opacity="0.8"/>
    <circle cx="900" cy="500" r="3" opacity="0.7"/><circle cx="980" cy="420" r="4" opacity="0.8"/><circle cx="820" cy="560" r="2.5" opacity="0.6"/>
    <circle cx="1040" cy="560" r="3" opacity="0.7"/><circle cx="60" cy="520" r="3" opacity="0.6"/>
  </g>
  <g fill="#ffb35a" filter="url(#blur2)" opacity="0.5">
    <circle cx="380" cy="360" r="9"/><circle cx="980" cy="420" r="9"/><circle cx="560" cy="330" r="8"/>
  </g>

  <!-- 暗角 -->
  <rect width="1600" height="900" fill="url(#vig)"/>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
</svg>
